name: PackBall Analytics — Build Diário

on:
  schedule:
    - cron: '0 7 * * *'  # 04h Brasília
  workflow_dispatch:
    inputs:
      date:
        description: 'Data para processar (YYYY-MM-DD ou "today")'
        required: false
        default: 'today'

concurrency:
  group: build-diario
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install requests pandas numpy

      - name: Coletar dados da API
        env:
          API_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          DATE="${{ github.event.inputs.date || 'today' }}"

          if [ "$DATE" = "today" ]; then
            # Calcular datas em Brasília (UTC-3)
            TODAY=$(TZ="America/Sao_Paulo" date +%Y-%m-%d)
            D1=$(TZ="America/Sao_Paulo" date -d "+1 day" +%Y-%m-%d)
            D2=$(TZ="America/Sao_Paulo" date -d "+2 days" +%Y-%m-%d)
            D3=$(TZ="America/Sao_Paulo" date -d "+3 days" +%Y-%m-%d)
            D4=$(TZ="America/Sao_Paulo" date -d "+4 days" +%Y-%m-%d)
            D5=$(TZ="America/Sao_Paulo" date -d "+5 days" +%Y-%m-%d)

            echo "Coletando janela: $TODAY | $D1 | $D2 | $D3 | $D4 | $D5"

            # D0 (hoje) - so coleta se ainda nao existe
            python scripts/coletar.py --key "$API_KEY" --date "$TODAY"

            # D+1 a D+5 - sempre atualiza (dados melhoram conforme aproxima)
            python scripts/coletar.py --key "$API_KEY" --date "$D1" --force
            python scripts/coletar.py --key "$API_KEY" --date "$D2" --force
            python scripts/coletar.py --key "$API_KEY" --date "$D3" --force
            python scripts/coletar.py --key "$API_KEY" --date "$D4" --force
            python scripts/coletar.py --key "$API_KEY" --date "$D5" --force
          else
            # Coleta manual de data específica
            python scripts/coletar.py --key "$API_KEY" --date "$DATE"
          fi

      - name: Commit e push do site atualizado
        run: |
          git config user.name  "PackBall Bot"
          git config user.email "bot@packball.local"
          python scripts/gerar_site.py
          git add docs/
          git diff --staged --quiet && echo "Sem mudanças" && exit 0
          git commit -m "📊 Site atualizado $(date -u +'%d/%m/%Y %H:%M UTC')"
          git pull origin main --rebase -X ours
          git push
