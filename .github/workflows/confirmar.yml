name: PackBall — Confirmar Resultados

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Data YYYY-MM-DD ou "yesterday"'
        default: 'yesterday'

jobs:
  confirmar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - env:
          API_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/confirmar.py --key "$API_KEY" --date "${{ github.event.inputs.date || 'today' }}"
      - run: |
          git config user.name "PackBall Bot"
          git config user.email "bot@packball.local"
          git add docs/
          git diff --staged --quiet || git commit -m "✅ Resultados atualizados $(date -u +'%d/%m/%Y %H:%M UTC')"
          git push
