name: PackBall - Confirmar Resultados

on:
  schedule:
    - cron: '0,30 14-23 * * *'   # 11h as 20h30 Brasilia, a cada 30 min
    - cron: '0,30 0,1,2 * * *'   # 21h as 23h30 Brasilia, a cada 30 min
  workflow_dispatch:
    inputs:
      date:
        description: 'Data unica YYYY-MM-DD ou "yesterday" (opcional se usar intervalo)'
        required: false
        default: ''
      start_date:
        description: 'Inicio do intervalo YYYY-MM-DD (opcional)'
        required: false
        default: ''
      end_date:
        description: 'Fim do intervalo YYYY-MM-DD (opcional)'
        required: false
        default: ''

concurrency:
  group: confirmar-resultados
  cancel-in-progress: true

jobs:
  confirmar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests numpy

      - name: Confirmar resultados
        env:
          API_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ] || [ -n "${{ github.event.inputs.end_date }}" ]; then
            # Execucao manual: intervalo de datas.
            START_DATE="${{ github.event.inputs.start_date }}"
            END_DATE="${{ github.event.inputs.end_date }}"

            if [ -z "$START_DATE" ] || [ -z "$END_DATE" ]; then
              echo "Para usar intervalo, preencha start_date e end_date."
              exit 1
            fi

            START_TS=$(date -d "$START_DATE" +%s)
            END_TS=$(date -d "$END_DATE" +%s)

            if [ "$START_TS" -gt "$END_TS" ]; then
              echo "start_date nao pode ser maior que end_date."
              exit 1
            fi

            CURRENT="$START_DATE"
            while [ "$(date -d "$CURRENT" +%s)" -le "$END_TS" ]; do
              echo "Confirmando: $CURRENT"
              if [ "$(date -d "$CURRENT" +%s)" -lt "$END_TS" ]; then
                python scripts/confirmar.py --key "$API_KEY" --date "$CURRENT" --no-site
              else
                python scripts/confirmar.py --key "$API_KEY" --date "$CURRENT"
              fi
              CURRENT=$(date -d "$CURRENT +1 day" +%Y-%m-%d)
            done
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            # Execucao manual: data especifica.
            python scripts/confirmar.py --key "$API_KEY" --date "${{ github.event.inputs.date }}"
          else
            # Execucao automatica: confirma anteontem, ontem e hoje.
            TWO_DAYS_AGO=$(TZ="America/Sao_Paulo" date -d "-2 day" +%Y-%m-%d)
            YESTERDAY=$(TZ="America/Sao_Paulo" date -d "-1 day" +%Y-%m-%d)
            TODAY=$(TZ="America/Sao_Paulo" date +%Y-%m-%d)
            echo "Confirmando: $TWO_DAYS_AGO, $YESTERDAY e $TODAY"
            python scripts/confirmar.py --key "$API_KEY" --date "$TWO_DAYS_AGO" --no-site
            python scripts/confirmar.py --key "$API_KEY" --date "$YESTERDAY" --no-site
            python scripts/confirmar.py --key "$API_KEY" --date "$TODAY"
          fi

      - name: Commit e push
        run: |
          git config user.name "PackBall Bot"
          git config user.email "bot@packball.local"
          git add docs/
          git diff --staged --quiet && echo "Sem mudancas" && exit 0
          git commit -m "Resultados atualizados $(date -u +'%d/%m/%Y %H:%M UTC')"
          git pull origin main --rebase -X ours
          git push
