name: PackBall - Reprocessar Intervalo de Datas

on:
  workflow_dispatch:
    inputs:
      date_start:
        description: 'Data inicial (YYYY-MM-DD)'
        required: true
        default: '2026-05-24'
      date_end:
        description: 'Data final (YYYY-MM-DD)'
        required: true
        default: '2026-05-31'
      recalcular_palpites:
        description: 'Recalcular palpites? Use true apenas para reconstruir historico.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  reprocessar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas numpy

      - name: Processar intervalo de datas
        env:
          API_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python3 << 'PYEOF'
          import subprocess, sys
          from datetime import date, timedelta

          start = date.fromisoformat("${{ github.event.inputs.date_start }}")
          end = date.fromisoformat("${{ github.event.inputs.date_end }}")
          today = date.today()
          recalcular_palpites = "${{ github.event.inputs.recalcular_palpites }}" == "true"

          current = start
          while current <= end:
              ds = current.strftime("%Y-%m-%d")
              print(f"\n{'=' * 50}")
              print(f"Processando {ds}...")
              print(f"{'=' * 50}")

              if recalcular_palpites:
                  print("\nRecalculando palpites...")
                  r = subprocess.run(
                      [sys.executable, "scripts/coletar.py",
                       "--key", "${{ secrets.APIFOOTBALL_KEY }}",
                       "--date", ds, "--no-site"],
                      capture_output=False
                  )
                  if r.returncode != 0:
                      print(f"coletar.py retornou erro para {ds}, continuando...")
              else:
                  print("\nPalpites preservados; apenas resultados serao confirmados.")

              if current <= today:
                  print("\nConfirmando resultados...")
                  r2 = subprocess.run(
                      [sys.executable, "scripts/confirmar.py",
                       "--key", "${{ secrets.APIFOOTBALL_KEY }}",
                       "--date", ds, "--no-site"],
                      capture_output=False
                  )
                  if r2.returncode != 0:
                      print(f"confirmar.py retornou erro para {ds}, continuando...")

              current += timedelta(days=1)

          print("\nGerando site...")
          subprocess.run([sys.executable, "scripts/gerar_site.py"])
          print("\nReprocessamento concluido!")
          PYEOF

      - name: Commit e push
        run: |
          git config user.name "PackBall Bot"
          git config user.email "bot@packball.local"
          git add docs/
          git diff --staged --quiet || git commit -m "Reprocessado ${{ github.event.inputs.date_start }} -> ${{ github.event.inputs.date_end }}"
          git pull origin main --rebase -X ours
          git push
