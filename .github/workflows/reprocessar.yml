name: PackBall — Reprocessar Intervalo de Datas

on:
  workflow_dispatch:
    inputs:
      date_start:
        description: 'Data inicial (YYYY-MM-DD)'
        required: true
        default: '2026-05-24'
      date_end:
        description: 'Data final (YYYY-MM-DD)'
        required: true
        default: '2026-05-31'

jobs:
  reprocessar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests pandas numpy

      - name: Processar intervalo de datas
        env:
          API_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python3 << 'PYEOF'
          import subprocess, sys
          from datetime import date, timedelta

          start = date.fromisoformat("${{ github.event.inputs.date_start }}")
          end   = date.fromisoformat("${{ github.event.inputs.date_end }}")
          today = date.today()

          current = start
          while current <= end:
              ds = current.strftime("%Y-%m-%d")
              print(f"\n{'='*50}")
              print(f"📅 Processando {ds}...")
              print(f"{'='*50}")

              # Sempre coleta (palpites)
              print(f"\n🔄 Coletando palpites...")
              r = subprocess.run(
                  [sys.executable, "scripts/coletar.py",
                   "--key", "${{ secrets.APIFOOTBALL_KEY }}",
                   "--date", ds, "--no-site"],
                  capture_output=False
              )
              if r.returncode != 0:
                  print(f"⚠ coletar.py retornou erro para {ds}, continuando...")

              # Confirma apenas datas passadas ou hoje
              if current <= today:
                  print(f"\n✅ Confirmando resultados...")
                  r2 = subprocess.run(
                      [sys.executable, "scripts/confirmar.py",
                       "--key", "${{ secrets.APIFOOTBALL_KEY }}",
                       "--date", ds, "--no-site"],
                      capture_output=False
                  )
                  if r2.returncode != 0:
                      print(f"⚠ confirmar.py retornou erro para {ds}, continuando...")

              current += timedelta(days=1)

          # Gera o site uma única vez no final
          print(f"\n🌐 Gerando site...")
          subprocess.run([sys.executable, "scripts/gerar_site.py"])
          print("\n✅ Reprocessamento concluído!")
          PYEOF

      - name: Commit e push
        run: |
          git config user.name "PackBall Bot"
          git config user.email "bot@packball.local"
          git add docs/
          git diff --staged --quiet || git commit -m "🔄 Reprocessado ${{ github.event.inputs.date_start }} → ${{ github.event.inputs.date_end }}"
          git pull --rebase origin main
          git push
